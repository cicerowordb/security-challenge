listen=YES
listen_ipv6=NO
listen_port=21
max_clients=500
max_per_ip=500

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

dirmessage_enable=YES
use_localtime=YES
xferlog_enable=NO
connect_from_port_20=YES

delay_failed_login=0
delay_successful_login=0
vsftpd_log_file=/dev/null

chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

pam_service_name=vsftpd
userlist_enable=NO

pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=172.28.0.10

seccomp_sandbox=NO
