[global]
   workgroup = WORKGROUP
   server string = Lab SMB
   security = user
   map to guest = never
   server min protocol = NT1
   ntlm auth = yes
   restrict anonymous = 0
   passdb backend = tdbsam
   smb ports = 445 139
   log file = /var/log/samba/log.%m
   max log size = 1000
   unix charset = UTF-8
   log level = 1

[labshare]
   path = /srv/smb/labshare
   browseable = yes
   read only = no
   valid users = @smbusers
   create mask = 0660
   directory mask = 0770
